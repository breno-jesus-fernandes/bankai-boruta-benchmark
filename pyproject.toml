[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bankai-boruta-benchmark"
version = "0.1.0"
description = "Reproducible, process-isolated Bankai Boruta benchmark suite"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1", "scipy>=1.13", "scikit-learn>=1.6", "psutil>=6", "Boruta==0.4.3", "lightgbm>=4.6,<5", "bankai-random-forest==0.1.0a15", "bankai-boruta==0.1.0a5", "boto3[crt]>=1.35"]

[project.scripts]
bankai-benchmark = "bankai_benchmark.orchestrator:main"
bankai-aggregate = "bankai_benchmark.aggregate_latex:main"
bankai-aws = "bankai_benchmark.aws_ecs:main"

[dependency-groups]
dev = [
    "matplotlib>=3.9,<4",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bankai_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
