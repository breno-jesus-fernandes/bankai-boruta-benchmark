name: benchmark
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --locked
      - run: uv run pytest
      - run: make smoke
      - run: make aggregate
      - run: make smoke
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            verification/v2-a6-r5-local/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docker-smoke
